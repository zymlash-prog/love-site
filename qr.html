<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Heart QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff5f7;
    font-family:Arial,sans-serif;
    color:#3b1f27;
  }
  .wrap{text-align:center}
  h1{font-size:24px;margin:0 0 22px}
  .heart{
    position:relative;
    width:330px;
    height:300px;
    margin:auto;
    transform:rotate(-45deg);
    background:#fff;
    border-radius:22px;
    box-shadow:0 12px 35px rgba(80,30,45,.14);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .heart:before,.heart:after{
    content:"";
    position:absolute;
    width:330px;
    height:300px;
    background:#fff;
    border-radius:50%;
    z-index:-1;
  }
  .heart:before{top:-150px;left:0}
  .heart:after{top:0;left:150px}
  #qrcode{
    transform:rotate(45deg);
    background:#fff;
    padding:12px;
    border-radius:12px;
    position:relative;
    z-index:2;
  }
  #qrcode img,#qrcode canvas{display:block}
  p{margin:24px 0 0;font-size:15px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <h1>Scan our little heart</h1>
  <div class="heart"><div id="qrcode"></div></div>
  <p>Point your camera at the QR code</p>
</div>
<script>
new QRCode(document.getElementById("qrcode"),{
  text:"https://love-site-j7d7.onrender.com/",
  width:210,
  height:210,
  colorDark:"#000000",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.H
});
</script>
</body>
</html>
